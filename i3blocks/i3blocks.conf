# i3blocks configuration file
#
# The i3blocks man page describes the usage of the binary,
# and its website describes the configuration:
#
#     https://vivien.github.io/i3blocks

# Global properties
separator=true
separator_block_width=15

[cpu]
color=#afff75
command=sensors | grep CPU | awk '{print $2}'
interval=5
label=cpu:

[mem]
color=#afff75
command=mem.sh
interval=5
label=mem:

[bat]
color=#afff75
command=bat.sh
interval=50
label=bat:

[vol]
color=#afff75
command=vol.sh
interval=once
signal=1
label=vol:

[time]
color=#afff75
command=date '+%a %d-%m-%Y|%H:%M:%S'
interval=5
